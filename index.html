<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandra Fischer — Portfolio</title>
    <link rel="canonical" href="https://sandrafischer.github.io/SandraFischer_Website/de/">
    <script>
        (function() {
            // Browsersprache prüfen: Bei de* -> /de/, sonst immer -> /en/
            var userLang = navigator.language || navigator.userLanguage || '';
            var target = userLang.toLowerCase().startsWith('de') ? 'de/' : 'en/';
            window.location.replace(target);
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=de/">
    </noscript>
</head>
